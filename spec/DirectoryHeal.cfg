\* Directory.tla with PutSession's renew and DeleteSession as the code does
\* them, a GET and later a SET or DEL (finding 38): the race heals at the
\* agent's latest session's next renewal (make spec; spec.sh checks that the
\* race does break DeleteOwn and NoResurrect meanwhile).
CONSTANTS
    Pods = {"p1", "p2"}
    Keys = {"d", "s"}
    MaxSess = 3
    Loss = FALSE
    NoSeq = FALSE
    TwoStep = TRUE
    Mutant = "none"
    WalkDepth = 0
    WalkDir = ""
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Heals
