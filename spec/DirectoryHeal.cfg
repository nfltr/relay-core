\* Directory.tla with PutSession's renew as the code does it, a GET and
\* later a SET (finding 38): the race heals at the agent's latest session's
\* next renewal (make spec; spec.sh checks that it does break NoResurrect
\* meanwhile). DeleteSession and the index prune are one store step each
\* (finding 47): DeleteOwn and IndexComplete hold under the race.
CONSTANTS
    Pods = {"p1", "p2"}
    Keys = {"d", "s"}
    MaxSess = 3
    Loss = FALSE
    NoSeq = FALSE
    TwoStep = TRUE
    Mutant = "none"
    WalkDepth = 0
    WalkDir = ""
SPECIFICATION Spec
INVARIANTS TypeOK DeleteOwn IndexComplete
PROPERTY Heals
