\* One session, caps 0..1 unit a day, two units per transfer, one cap
\* change, one day boundary, one reconnection of the serving agent: the
\* smallest size that catches every mutant; invariants (make spec);
\* spec.sh mutants puts each bug back. NF1CapLarge.cfg: two sessions,
\* caps 0..2, two changes (nightly).
CONSTANTS
    Sess = {"s1"}
    Caps = {0, 1}
    MaxUnits = 2
    MaxSets = 1
    MaxDays = 1
    MaxConns = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    CountedOnce
    CapBounded
    BoundSound
    NoCapOnOwner
    TypedFailure
