\* One session on one stream with credit through a window of 2 (3 bytes
\* each way), the stream may fail: invariants (make spec-nightly).
CONSTANTS
    Sess = {1}
    Win <- MCWin
    Chunk = 2
    MaxBytes = 3
    Credit = TRUE
    InProc = {}
    CanBreak = TRUE
    Fair = 1
    Aborts = TRUE
    EndAck = TRUE
    OutCap = 9
    RelayAbort = TRUE
    Mutant = "none"
SPECIFICATION Spec
PROPERTY Refines
INVARIANTS
    NoProtocolError
    CreditBounds
    BufferBound
    Conservation
    NoHOL
    TypedEnd
    DownEndsAll
    NoSilentLoss
    AbortTyped
