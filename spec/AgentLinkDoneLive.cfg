\* Liveness of the end's delivery report (EndDone): one session whose apps
\* are fair, the stream does not fail, both sides half-close (crossing
\* closes included): Isolation and DoneComes. hold-on-done (holds on the
\* report, lane ENDGRPC finding 8's cycle) fails Isolation.
CONSTANTS
    Sess = {1}
    Win <- MCWin1
    Chunk = 1
    MaxBytes = 1
    Credit = TRUE
    InProc = {}
    CanBreak = FALSE
    Fair = 1
    Aborts = FALSE
    EndAck = TRUE
    EndDone = TRUE
    OutCap = 9
    RelayAbort = TRUE
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS
    NoProtocolError
    TypedEnd
    DoneTruth
PROPERTIES
    Isolation
    DoneComes
