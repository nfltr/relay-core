\* An anonymous session does not stay relayed: the relay's time limit
\* (make spec-liveness; its mutant in make spec-mutants).
CONSTANTS
    Sess = {"s1"}
    LegBudget = 2
    AddrBudget = 3
    MaxUnits = 3
    Lifetime = 1
    MaxRegs = 2
    Mutant = "none"
SPECIFICATION LiveSpec
PROPERTIES
    LeavesRelay
