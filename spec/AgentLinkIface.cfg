\* Refines on one byte each way (make spec, in make ci): AgentLink.cfg with
\* Refines is the nightly's (make spec-nightly), where it triples the run.
CONSTANTS
    Sess = {1}
    Win <- MCWin
    Chunk = 1
    MaxBytes = 1
    Credit = TRUE
    InProc = {1}
    CanBreak = TRUE
    Fair = 1
    Aborts = TRUE
    EndAck = TRUE
    OutCap = 9
    Mutant = "none"
SPECIFICATION Spec
PROPERTY Refines
INVARIANTS
    NoProtocolError
    CreditBounds
    BufferBound
    Conservation
    NoHOL
    TypedEnd
    DownEndsAll
    NoSilentLoss
    AbortTyped
