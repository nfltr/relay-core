\* The design: two pods, both record keys, three claims, the store may
\* restart empty once: invariants (make spec). Every renewal and
\* every delete is one store step (Cache.SetAddIf, Cache.DelIf).
CONSTANTS
    Pods = {"p1", "p2"}
    Keys = {"d", "s"}
    MaxSess = 3
    Loss = TRUE
    NoSeq = TRUE
    Mutant = "none"
    WalkDepth = 0
    WalkDir = ""
SPECIFICATION Spec
INVARIANTS
    TypeOK
    SupersededByNewer
    NoResurrect
    DeleteOwn
    NoPingPong
    IndexComplete
