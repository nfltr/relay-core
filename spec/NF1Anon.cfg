\* Two sessions, an anonymous server and an account's, three units per
\* transfer against a leg budget of two and an address budget of three:
\* invariants (make spec); spec.sh mutants puts each bug back.
CONSTANTS
    Sess = {"s1", "s2"}
    LegBudget = 2
    AddrBudget = 3
    MaxUnits = 3
    Lifetime = 1
    MaxRegs = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    LegBounded
    AddrBounded
    NoCutOnAccount
    TypedFailure
    RegBounded
