\* One session (to the anonymous server or an account's), four units per
\* transfer against a leg budget of two and an address budget of two (a
\* re-attach is the second leg): the smallest size that catches every
\* mutant; invariants (make spec); spec.sh mutants puts each bug back.
\* NF1AnonLarge.cfg: two sessions (nightly).
CONSTANTS
    Sess = {"s1"}
    LegBudget = 2
    AddrBudget = 2
    MaxUnits = 4
    Lifetime = 1
    MaxRegs = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    LegBounded
    AddrBounded
    NoCutOnAccount
    TypedFailure
    RegBounded
