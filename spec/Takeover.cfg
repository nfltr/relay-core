\* Two processes of one agent ID on one machine (one credential) and one
\* with another credential on another machine: invariants (make spec).
CONSTANTS
    Procs = {"p1", "p2", "p3"}
    Cred <- TwoAndOther
    Mach <- TwoAndOtherMach
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSilentReplace
    DuplicateRefused
    NoFalseRefusal
    LockLive
