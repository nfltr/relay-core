\* Key-file accounts, every machine enrolled by a code: invariants (make
\* spec); spec.sh mutants plants each bug. Three codes: an own account, a
\* join, and a join after a revoke (the witnesses need each).
CONSTANTS
    Ids = {i1, i2, i3}
    Names = {n1, n2}
    None = None
    Codes = {c1, c2, c3}
    Keys = {k1}
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AccountStable
    AccountRooted
    NamesUnique
    SameAccountReaches
    ResolveOwnAccount
    EnrolCodeSingleUse
    CertBoundToLine
    EnrolledAsCoded
