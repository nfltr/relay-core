\* Liveness: one session, the stream may fail: every session then ends at
\* both sides.
CONSTANTS
    Sess = {1}
    Win <- MCWin1
    Chunk = 1
    MaxBytes = 2
    Credit = TRUE
    InProc = {}
    CanBreak = TRUE
    Fair = 1
    Aborts = TRUE
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS
    NoProtocolError
    TypedEnd
    DownEndsAll
PROPERTIES
    EndsAfterBreak
