\* An inProcConn's Write returns once its Close was called, while the agent
\* reads nothing more and the stream stays up (finding 3): WriteReturns
\* (make spec, in make ci).
CONSTANTS
    Sess = {1}
    Win <- MCWinW
    Chunk = 1
    MaxBytes = 2
    Credit = TRUE
    InProc = {1}
    CanBreak = FALSE
    Fair = 1
    Aborts = TRUE
    EndAck = TRUE
    OutCap = 1
    Mutant = "none"
SPECIFICATION WriteSpec
PROPERTY
    WriteReturns
