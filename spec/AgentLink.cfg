\* One session on one stream with credit through a window of 2 (2 bytes,
\* 1 a frame, each way), its relay end an inProcConn, the stream may fail: invariants
\* (make spec, in make ci; AgentLinkLarge.cfg is the nightly's).
CONSTANTS
    Sess = {1}
    Win <- MCWin
    Chunk = 1
    MaxBytes = 2
    Credit = TRUE
    InProc = {1}
    CanBreak = TRUE
    Fair = 1
    Aborts = TRUE
    EndAck = TRUE
    OutCap = 9
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    NoProtocolError
    CreditBounds
    BufferBound
    Conservation
    NoHOL
    TypedEnd
    DownEndsAll
    NoSilentLoss
    AbortTyped
