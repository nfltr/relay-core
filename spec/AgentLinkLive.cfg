\* Liveness: two sessions, the stream does not fail; session 1's apps are
\* fair, session 2's readers may never read (Isolation). Window 1.
CONSTANTS
    Sess = {1, 2}
    Win <- MCWin1
    Chunk = 1
    MaxBytes = 1
    Credit = TRUE
    InProc = {}
    CanBreak = FALSE
    Fair = 1
    Aborts = FALSE
    EndAck = TRUE
    OutCap = 9
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS
    NoProtocolError
    NoHOL
    TypedEnd
PROPERTIES
    Isolation
